name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate paths and Markdown links
        run: python tools/validate_repository.py

      - name: Validate package and environment metadata
        run: |
          python - <<'PY'
          import tomllib
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for path in Path("src").rglob("package.xml"):
              ET.parse(path)
          for path in Path(".").rglob("pixi.toml"):
              tomllib.loads(path.read_text(encoding="utf-8"))
          PY

      - name: Compile Python sources
        run: python -m compileall -q src tools
